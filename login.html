<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · Gestor de Proyectos y PERT</title>
<link rel="icon" href="icons/appIcon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#1e1b38;
  --bg-grad:radial-gradient(circle at 30% 20%, #2b2752 0%, #1c1936 55%, #151329 100%);
  --card:#272449;
  --card-line:rgba(255,255,255,0.06);
  --shadow:0 20px 42px rgba(9, 7, 22, 0.58), 0 2px 6px rgba(0,0,0,0.3);
  --ink:#f5f6ff;
  --muted:#9d99c7;
  --field:#1e1b38;
  --field-line:#4a4578;
  --err:#ff8a8a;
  --ok:#00f59b;
  --grad-h:linear-gradient(90deg, #00f59b 0%, #00d0ff 52%, #3b66ff 100%);
  --grad-v:linear-gradient(180deg, #3b66ff 0%, #00d0ff 50%, #00f59b 100%);
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  --bg:#e9ecf7;
  --bg-grad:radial-gradient(circle at 30% 20%, #f5f7ff 0%, #e6eaf8 65%, #dce1f4 100%);
  --card:#ffffff;
  --card-line:rgba(30,27,56,0.08);
  --shadow:0 16px 36px rgba(28, 25, 58, 0.10), 0 2px 6px rgba(28,25,58,0.05);
  --ink:#1e1b38;
  --muted:#67638f;
  --field:#f5f6fc;
  --field-line:#d5d8ec;
  --err:#c62828;
  --ok:#00875a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%;margin:0}
body{
  background:var(--bg);background-image:var(--bg-grad);color:var(--ink);font-family:var(--sans);
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px;
}
.card{
  width:min(420px,100%);background:var(--card);border:1px solid var(--card-line);border-radius:16px;
  box-shadow:var(--shadow);padding:30px 28px 26px 46px;position:relative;
}
.card::before{
  content:"";position:absolute;left:24px;top:24px;bottom:24px;width:3px;border-radius:4px;
  background:var(--grad-v);box-shadow:0 0 12px rgba(0,245,155,0.45);
}
h1{font-size:1.25rem;margin:0 0 6px}
.sub{margin:0 0 20px;color:var(--muted);font-size:.94rem;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--field);border-radius:99px;padding:4px}
.tab{flex:1;border:0;border-radius:99px;padding:8px 10px;font:inherit;font-weight:700;font-size:.9rem;
  background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--grad-h);color:#10122a}
label{display:block;font-size:.85rem;font-weight:700;margin:12px 0 6px}
input{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--field-line);background:var(--field);
  color:var(--ink);font:inherit;font-size:.95rem;
}
input:focus{outline:2px solid #00d0ff;outline-offset:1px}
.btn{
  width:100%;margin-top:18px;border:0;border-radius:99px;padding:11px 16px;font:inherit;font-weight:700;
  font-size:.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn.grad{background:var(--grad-h);color:#10122a}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--field-line);margin-top:12px}
.btn:disabled{opacity:.6;cursor:progress}
.sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem;margin:18px 0 0}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--field-line)}
.link{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:.85rem;text-decoration:underline;cursor:pointer;margin-top:14px}
.msg{margin:14px 0 0;font-size:.9rem;line-height:1.45;min-height:1.2em}
.msg.err{color:var(--err)}
.msg.ok{color:var(--ok)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
</head>
<body>
<main class="card">
  <h1>Gestor de Proyectos y PERT</h1>
  <p class="sub" id="sub">Inicia sesión para guardar tus proyectos en la nube y abrirlos desde cualquier ordenador.</p>

  <div class="tabs" role="tablist" id="tabs">
    <button type="button" class="tab" role="tab" aria-selected="true" data-mode="login">Entrar</button>
    <button type="button" class="tab" role="tab" aria-selected="false" data-mode="signup">Crear cuenta</button>
  </div>

  <form id="form" novalidate>
    <div id="email-wrap">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div id="pass-wrap">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    </div>
    <button type="submit" class="btn grad" id="submit">Entrar</button>
  </form>

  <button type="button" class="link" id="forgot">¿Has olvidado la contraseña?</button>

  <div class="sep">o</div>
  <button type="button" class="btn ghost" id="google">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
    <span>Continuar con Google</span>
  </button>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script>
(function(){
  var client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_KEY);
  var params=new URLSearchParams(location.search);
  var next=params.get('next')||'index.html';
  if(!/^[\w-]+\.html$/.test(next))next='index.html';
  var mode='login';
  var $=function(id){return document.getElementById(id);};
  var form=$('form'),email=$('email'),pass=$('password'),submit=$('submit'),msg=$('msg');

  function say(text,kind){msg.textContent=text||'';msg.className='msg'+(kind?' '+kind:'');}
  function busy(on){submit.disabled=on;$('google').disabled=on;}
  function done(){location.replace(next);}

  var ERR={
    'Invalid login credentials':'Correo o contraseña incorrectos.',
    'Email not confirmed':'Aún no has confirmado tu correo. Revisa tu bandeja de entrada.',
    'User already registered':'Ya existe una cuenta con ese correo. Pulsa «Entrar».',
    'Password should be at least 6 characters.':'La contraseña debe tener al menos 6 caracteres.'
  };
  function errText(e){var m=(e&&e.message)||String(e);return ERR[m]||('No se ha podido completar: '+m);}

  function setMode(m){
    mode=m;
    document.querySelectorAll('.tab').forEach(function(t){t.setAttribute('aria-selected',String(t.dataset.mode===m));});
    $('tabs').hidden=m==='reset'||m==='newpass';
    $('pass-wrap').hidden=m==='reset';
    $('email-wrap').hidden=m==='newpass';
    $('forgot').hidden=m!=='login';
    pass.autocomplete=m==='login'?'current-password':'new-password';
    submit.textContent={login:'Entrar',signup:'Crear cuenta',reset:'Enviar enlace',newpass:'Guardar contraseña'}[m];
    $('sub').textContent={
      login:'Inicia sesión para guardar tus proyectos en la nube y abrirlos desde cualquier ordenador.',
      signup:'Crea tu cuenta. Te enviaremos un correo para confirmarla.',
      reset:'Escribe tu correo y te enviaremos un enlace para elegir una contraseña nueva.',
      newpass:'Escribe tu nueva contraseña.'
    }[m];
    say('');
  }
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){setMode(t.dataset.mode);};});
  $('forgot').onclick=function(){setMode('reset');};

  var base=location.origin+location.pathname.replace(/[^/]*$/,'');

  form.onsubmit=async function(e){
    e.preventDefault();
    var em=email.value.trim(),pw=pass.value;
    if(mode!=='newpass'&&!/^\S+@\S+\.\S+$/.test(em)){say('Escribe un correo válido.','err');email.focus();return;}
    if(mode!=='reset'&&pw.length<6){say('La contraseña debe tener al menos 6 caracteres.','err');pass.focus();return;}
    busy(true);say('Un momento…');
    try{
      var r;
      if(mode==='login'){
        r=await client.auth.signInWithPassword({email:em,password:pw});
        if(r.error)throw r.error;
        done();return;
      }
      if(mode==='signup'){
        r=await client.auth.signUp({email:em,password:pw,options:{emailRedirectTo:base+'login.html'}});
        if(r.error)throw r.error;
        if(r.data.session){done();return;}
        say('Cuenta creada. Abre el correo que te hemos enviado a '+em+' para confirmarla y después entra.','ok');
        setTimeout(function(){setMode('login');say('Cuenta creada. Confirma tu correo y entra aquí.','ok');},50);
      }
      if(mode==='reset'){
        r=await client.auth.resetPasswordForEmail(em,{redirectTo:base+'login.html'});
        if(r.error)throw r.error;
        say('Si existe una cuenta con '+em+', recibirás un correo con el enlace.','ok');
      }
      if(mode==='newpass'){
        r=await client.auth.updateUser({password:pw});
        if(r.error)throw r.error;
        done();return;
      }
    }catch(err){say(errText(err),'err');}
    busy(false);
  };

  $('google').onclick=async function(){
    busy(true);say('Abriendo Google…');
    // prompt=select_account: Google muestra siempre la lista de cuentas en vez de entrar con la última usada.
    var r=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:base+'login.html?next='+encodeURIComponent(next),queryParams:{prompt:'select_account'}}});
    if(r.error){busy(false);say(/provider is not enabled/i.test(r.error.message)?'El inicio con Google aún no está activado.':errText(r.error),'err');}
  };

  // Vuelta desde un enlace del correo o desde Google.
  var hashErr=new URLSearchParams(location.hash.slice(1)).get('error_description')||params.get('error_description');
  if(hashErr)say(hashErr.replace(/\+/g,' '),'err');
  client.auth.onAuthStateChange(function(ev,s){
    if(ev==='PASSWORD_RECOVERY'){setMode('newpass');return;}
    if(s&&ev==='SIGNED_IN'&&mode!=='newpass'&&/access_token|code=/.test(location.href))done();
  });
  client.auth.getSession().then(function(r){
    if(r.data.session&&!/type=recovery/.test(location.hash)&&mode!=='newpass')done();
  });
})();
</script>
</body>
</html>
